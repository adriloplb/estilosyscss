<!-- Cabecera de la aplicación Ionic -->
<ion-header [translucent]="true">
  <ion-toolbar>
    <!-- Título en la barra superior con clase personalizada -->
    <ion-title class="titulo-principal">MI APLICACIÓN IONIC</ion-title>
  </ion-toolbar>
</ion-header>

<!-- Contenido principal de la página -->
<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Contenedor para alinear el botón a la derecha -->
  <div class="contenedor-boton">
    <ion-button class="boton-azul">Acción Azul</ion-button>
  </div>

  <!-- Contenedor para centrar la imagen -->
  <div class="contenedor-imagen">
    <img 
      src="https://picsum.photos/300/200" 
      alt="Imagen de prueba" 
      class="imagen-borde-verde" />
  </div>

</ion-content>
